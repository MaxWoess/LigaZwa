<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LigaZwa</title>
  <meta name="description" content="Tabelle, Spielplan, Live-Ticker und News zur 2. Liga Österreich">
  <meta name="theme-color" content="#c8102e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#tabelle"><img src="icon.svg" alt="" width="28" height="28"><span>LigaZwa</span></a>
    <span id="league-name" class="league-name">2. Liga</span>
    <button id="refresh-btn" class="icon-btn" aria-label="Neu laden" title="Neu laden">↻</button>
    <button id="settings-btn" class="icon-btn" aria-label="Einstellungen" title="Einstellungen">⚙</button>
  </header>

  <nav class="tabs">
    <a href="#tabelle"><span class="ni">▤</span>Tabelle</a>
    <a href="#spielplan"><span class="ni">▦</span>Spielplan</a>
    <a href="#live" id="nav-live"><span class="ni">●</span>Live</a>
    <a href="#news"><span class="ni">✎</span>News</a>
  </nav>

  <main id="view"></main>
  <div id="toasts" aria-live="polite"></div>

  <dialog id="match-dialog">
    <div class="dlg-head"><span>Spiel</span><button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div id="match-body"></div>
  </dialog>

  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <div class="dlg-head"><span>Einstellungen</span><button class="icon-btn" value="cancel" aria-label="Schließen">✕</button></div>
      <div id="settings-body" class="form"></div>
      <div class="btn-row end">
        <button value="cancel">Abbrechen</button>
        <button value="save" class="primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
