name: Probe laola1 (temporär)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node .github/probe/laola.cjs
      - name: CORS-Test
        run: |
          for u in https://matchcenter.laola1.at/data/Fussball/Oesterreich/2Liga/config.json $(grep -ohE 'https://matchcenter\.laola1\.at/data/[^" ]+' p/log.json | sort -u | head -15); do
            echo "=== $u"; curl -s -D - -o /dev/null -H 'Origin: https://maxwoess.github.io' "$u" | grep -iE '^(HTTP|access-control|cache-control|age|content-type)'
          done | tee p/cors.txt
      - name: Ergebnis auf probe-data ablegen
        run: |
          cd p && git init -q && git checkout -q -b probe-data
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
