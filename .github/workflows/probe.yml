name: Probe 2liga.at (temporär)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Seiten laden
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          mkdir -p p/js && cd p
          get() { curl -sL -m 30 -A "$UA" -o "$2" "$1"; echo "$1 -> $(wc -c < "$2")"; }
          get "https://www.2liga.at/de/spielbericht/saison-2026-2027/56857/matchcenter" mc-past.html
          get "https://www.2liga.at/de/spielbericht/saison-2026-2027/56865/matchcenter" mc-next.html
          get "https://www.2liga.at/de/spielplan?spieltag=1" sp-1.html
          get "https://www.2liga.at/de/spielplan?spieltag=30" sp-30.html
          get "https://www.2liga.at/de/news?page=2" news-2.html
          get "https://www.2liga.at/de/news/artikel/blau-weiss-linz-holte-sich-fuehrung-in-2-liga-zurueck" art.html
          grep -ohE '/_next/static/chunks/[^"]+\.js' *.html | sort -u | while read j; do get "https://www.2liga.at$j" "js/$(basename "$j")" >/dev/null; done
          ls -la js | wc -l
          grep -ohE 'https?://[a-zA-Z0-9.-]+\.[a-z]{2,}[^"'"'"' ]{0,80}' js/*.js | grep -viE 'w3\.org|reactjs|nextjs|github|mozilla|schema\.org' | sort | uniq -c | sort -rn | head -60
      - name: Auf Branch probe-data ablegen
        run: |
          cd p
          git init -q && git checkout -q -b probe-data
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-data
