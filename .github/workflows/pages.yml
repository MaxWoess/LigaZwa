name: Deploy & Daten

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # Tabelle, Spielplan, News alle 15 Minuten
  workflow_dispatch:
    inputs:
      full:
        description: 'Alle Runden neu laden'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # Bisherige Daten übernehmen – so muss nicht jedes Mal alles neu geladen werden
      - name: Vorherige Daten laden
        run: |
          for f in fixtures matches news config; do
            curl -sfL "${{ steps.pages.outputs.base_url }}/data/$f.json" -o "site/data/$f.json" || true
          done

      - name: Daten von 2liga.at holen
        run: node scraper/build.mjs
        env:
          FULL_REFRESH: ${{ inputs.full && '1' || '0' }}

      - name: News sammeln
        run: node scraper/news.mjs

      # Live-Ticker-Server (optional): nur wenn Cloudflare-Secrets hinterlegt sind, nur bei Push/manuell
      - name: Cloudflare Worker deployen
        if: github.event_name != 'schedule' && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 deploy --config worker/wrangler.toml | tee wrangler.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' wrangler.log | head -1)
          if [ -n "$url" ]; then echo "{\"liveUrl\":\"$url\"}" > site/data/config.json; fi

      - name: Live-URL aus Repository-Variable
        if: vars.LIVE_URL != ''
        run: echo '{"liveUrl":"${{ vars.LIVE_URL }}"}' > site/data/config.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
